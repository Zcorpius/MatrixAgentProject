org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.builtInKotlin=false

# 发布版本：Service、Launcher 与测试 APK 必须同步。Android 仅以 versionCode 判断升级；
# 当前编码规则为 major * 1_000_000 + minor * 1_000 + patch，因此 0.6.0 -> 6000。
# 每次发布同时提升 versionName 与 versionCode，避免旧 APK 覆盖新版。
MATRIX_VERSION_NAME=0.6.3
MATRIX_VERSION_CODE=6003
