org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# All project-owned Android sources are Java. Keep AGP's built-in Kotlin support available for
# tooling compatibility, but never publish or package its implicit kotlin-stdlib dependency.
kotlin.stdlib.default.dependency=false
# 发布版本：Service、Launcher 与测试 APK 必须同步。Android 仅以 versionCode 判断升级；
# 当前编码规则为 major * 1_000_000 + minor * 1_000 + patch，因此 0.6.0 -> 6000。
# 每次发布同时提升 versionName 与 versionCode，避免旧 APK 覆盖新版。
MATRIX_VERSION_NAME=0.6.14
MATRIX_VERSION_CODE=6014

# 内部调试轨迹 UI（评估 v1.0 §4.3）：只控制页面可见性，诊断日志无条件输出
matrix.debugTraceUi=true
