# Commit 1 版本锁定（重整版 §2.4 / §7-A.1）
#
# 约定：
# - AGP 9.0.1 / Gradle 9.3.1 / JDK 17；minSdk 28 / compileSdk 36 / targetSdk 36（三个 APK）。
# - [老工程已验证]：提取自 /Users/zhangyongbin/Desktop/Learn/AI/MatrixAgent，在该构建基线下跑通。
# - [新增]：本次锁定、尚未在本工程编译验证，由首个引用批次负责验证后去掉标注。
# - 禁止 latest、动态版本或版本范围；升级须整表评审（compileSdk 36 为硬上限，
#   更高版本要求的 BOM/lifecycle 线不可升）。

[versions]
# 构建与 SDK 基线
agp = "9.0.1"
minSdk = "28"
compileSdk = "36"
targetSdk = "36"

# AndroidX [老工程已验证]
appcompat = "1.7.1"
fragment = "1.8.9"
lifecycle = "2.11.0"
drawerlayout = "1.2.0"
room = "2.7.0"
# SQLCipher Android 4.6.1+ supplies 16 KB page-size compatible native libraries.
# Keep androidx.sqlite on the current line required by its Room factory.
sqlite = "2.7.0"
# 4.6.1 is the first sqlcipher-android line with 16 KB support and still accepts
# this repository's compileSdk 36 / AGP 9 baseline. Newer 4.19.0 requires compileSdk 37.
sqlcipher = "4.6.1"

# AndroidX [新增]
work = "2.10.0"

# 网络 [新增]
okhttp = "4.12.0"

# 业务依赖 [老工程已验证]
jtokkit = "1.1.0"
vosk = "0.3.75"

# 端侧语音 [新增]
# sherpa-onnx 官方 AAR 只从 GitHub releases 分发（无 Maven 坐标），经 :ondevice 的
# 下载任务钉死版本 + SHA-256 后以本地 AAR 消费；其 Kotlin API 类运行时需要 kotlin-stdlib
# （本地 AAR 无 POM 传递依赖，须显式声明）。
kotlinStdlib = "2.1.21"
# Sherpa 模型上游（k2-fsa asr-models/kws-models）发布为 tar.bz2，java.util.zip 不解此格式
commonsCompress = "1.27.1"

# 测试 [老工程已验证]
junit = "4.13.2"
orgJson = "20240303"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
androidxTestRules = "1.6.1"

# 测试 [新增]
espresso = "3.6.1"

[libraries]
# AndroidX UI（Launcher）
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }

# 持久化（Service APK）
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# 调度（Service APK）
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }

# 网络（Service APK；MockWebServer 仅测试）
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# 业务
jtokkit = { group = "com.knuddels", name = "jtokkit", version.ref = "jtokkit" }
vosk = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }

# 端侧语音（:ondevice sherpa-onnx AAR 运行时依赖 / :matrix-agent-service tar.bz2 解压）
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }

# JVM 单测
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# androidTest
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
